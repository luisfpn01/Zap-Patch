name: Compile WatusiAdsPatch.dylib

on:
  workflow_dispatch:  # Allows manual triggering
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: macos-latest  # Uses GitHub's macOS runners with Xcode
    
    steps:
    - uses: actions/checkout@v4
      # This checks out your repository so the workflow can access WatusiAdsPatch.m
    
    - name: Verify source file exists
      run: |
        echo "Checking for WatusiAdsPatch.m..."
        ls -la WatusiAdsPatch.m
        if [ ! -f "WatusiAdsPatch.m" ]; then
          echo "❌ ERROR: WatusiAdsPatch.m not found in repository"
          echo "Please make sure WatusiAdsPatch.m is committed to your repo"
          exit 1
        fi
        echo "✅ Source file found"
    
    - name: Check Xcode availability
      run: |
        echo "Xcode version: $(xcodebuild -version)"
        echo "Command line tools path: $(xcode-select -p)"
    
    - name: Compile to .dylib
      run: |
        echo "🔨 Compiling WatusiAdsPatch.m to WatusiAdsPatch.dylib..."
        echo "Using command: clang -fobjc-arc -dynamiclib -arch arm64 -mios-version-min=14.0 -framework Foundation -framework UIKit WatusiAdsPatch.m -o WatusiAdsPatch.dylib"
        
        clang -fobjc-arc -dynamiclib -arch arm64 -mios-version-min=14.0 \
          -framework Foundation -framework UIKit \
          WatusiAdsPatch.m -o WatusiAdsPatch.dylib
        
        # Verify compilation succeeded
        if [ ! -f "WatusiAdsPatch.dylib" ]; then
          echo "❌ ERROR: Compilation failed - WatusiAdsPatch.dylib was not created"
          exit 1
        fi
        
        echo "✅ Compilation successful!"
        echo "📊 File info:"
        ls -lh WatusiAdsPatch.dylib
        file WatusiAdsPatch.dylib
    
    - name: Upload .dylib artifact
      uses: actions/upload-artifact@v4
      with:
        name: watusi-ads-patch-dylib
        path: WatusiAdsPatch.dylib
        retention-days: 30  # Keep artifacts for 30 days
