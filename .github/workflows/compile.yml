name: Compile iOS Tweak

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Theos
      run: |
        git clone https://github.com/theos/theos.git
        export THEOS=$(pwd)/theos
        export PATH=$THEOS/bin:$PATH
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "PATH=$PATH" >> $GITHUB_ENV
    - name: Verify Theos installation
      run: |
        echo "THEOS directory: $THEOS"
        echo "Current PATH: $PATH"
        echo "Contents of $THEOS/bin:"
        ls -la $THEOS/bin/
        
        # Check if dm.pl exists in Theos bin
        if [ -f "$THEOS/bin/dm.pl" ]; then
          echo "Found dm.pl in Theos bin"
          chmod +x "$THEOS/bin/dm.pl"  # Ensure it's executable
          ls -la $THEOS/bin/dm.pl
        else
          echo "dm.pl NOT found in $THEOS/bin"
          echo "Checking for similar tools:"
          ls $THEOS/bin/*.pl || echo "No .pl files found in bin"
        fi
        
        # Alternative: Try to find dm.pl anywhere in the repo
        echo "Searching for dm.pl in repository:"
        find . -name "dm.pl" -type f 2>/dev/null || echo "dm.pl not found in repository"
    - name: Compile tweak
      run: |
        # If dm.pl is a custom script in your repo, use relative path
        # If it's a Theos tool, use the full path
        # Common approach: just run make - Theos tools should be in PATH
        make package
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: watusi-tweak
        path: .theos/_/WatusiAdsPatch.dylib
